<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VacciCare+ | Feedback</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="contact">
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="index.html">VacciCare+</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="admin.html">Admin</a></li>
                    <li class="nav-item"><a class="nav-link" href="hospital.html">Hospital</a></li>
                    <li class="nav-item"><a class="nav-link" href="parent.html">Parent</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <header class="bg-gradient-primary text-white py-4">
        <div class="container text-center">
            <h2 class="fw-bold">Feedback</h2>
        </div>
    </header>

    <main class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Feedback Form</h5>
                        <form id="feedbackForm" novalidate>
                            <div class="row g-2">
                                <div class="col-md-6"><label class="form-label">Name</label><input class="form-control" id="fbName" required></div>
                                <div class="col-md-6"><label class="form-label">Contact</label><input class="form-control" id="fbContact" placeholder="email or phone" required></div>
                                <div class="col-12">
                                    <label class="form-label d-block">Rating</label>
                                    <div id="starRating" class="d-inline-flex gap-1" role="radiogroup" aria-label="Rating">
                                        <button type="button" class="btn btn-link p-0 fs-4" data-star="1">☆</button>
                                        <button type="button" class="btn btn-link p-0 fs-4" data-star="2">☆</button>
                                        <button type="button" class="btn btn-link p-0 fs-4" data-star="3">☆</button>
                                        <button type="button" class="btn btn-link p-0 fs-4" data-star="4">☆</button>
                                        <button type="button" class="btn btn-link p-0 fs-4" data-star="5">☆</button>
                                    </div>
                                    <input type="hidden" id="fbRating" value="5">
                                </div>
                                <div class="col-12"><label class="form-label">Comments</label><input class="form-control" id="fbComments" placeholder="Your message" required></div>
                            </div>
                            <button class="btn btn-primary w-100 mt-3" type="submit">Submit</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="py-4 bg-white border-top">
        <div class="container d-flex justify-content-between">
            <span class="text-muted">© <span id="year"></span> VacciCare+</span>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/app.js"></script>
</body>
</html>
